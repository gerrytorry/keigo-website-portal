{% extends 'core/base.html' %}{% block content %}<section class="panel"><h1>Konfirmasi perubahan massal</h1><p>{{ job.code }} · {{ job.title }}</p><form method="post">{% csrf_token %}{% for a in applications %}<p>{{ a.student.full_name }} — {{ a.get_status_display }}</p><input type="hidden" name="ids" value="{{ a.pk }}"><input type="hidden" name="revision_{{ a.pk }}" value="{{ a.revision }}">{% endfor %}<label>Tahap baru<select name="status" required>{% for value,label in states %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label>Catatan untuk siswa<textarea name="note" maxlength="2000"></textarea></label><label class="checkbox"><input type="checkbox" name="confirm" value="yes" required>Saya telah memeriksa semua kandidat terpilih.</label><button class="button">Konfirmasi perubahan</button></form></section>{% endblock %}
