{% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form.visible_fields %}<div class="field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or field.name in required_for_submit %} <span class="required">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="help" id="{{ field.id_for_label }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{{ field.errors }}</div>{% endfor %}</div>
