<form method="get" class="filters"><label>Pencarian<input name="q" value="{{ q }}" placeholder="Nama, kode, atau informasi terkait"></label><label>Status<select name="status"><option value="">Semua status</option>{% for value,label in states %}<option value="{{ value }}" {% if selected_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% if levels %}<label>Bahasa Jepang<select name="level"><option value="">Semua level</option>{% for value,label in levels %}<option value="{{ value }}" {% if request.GET.level == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% endif %}<button class="button">Cari</button></form>
